spring:
  application:
    name: nexus-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nexus_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:nexus-secret-key-minimum-256-bits-long-change-in-production}
    expiration-ms: 86400000       # 24 jam
    refresh-expiration-ms: 604800000  # 7 hari

  ai:
    provider: ${AI_PROVIDER:openai}   # openai | gemini
    openai:
      api-key: ${OPENAI_API_KEY:}
      embedding-model: text-embedding-3-small
      chat-model: gpt-4o-mini
    gemini:
      api-key: ${GEMINI_API_KEY:}
      embedding-model: text-embedding-004
      chat-model: gemini-1.5-flash

  upload:
    max-file-size: 20MB
    allowed-types: application/pdf,text/plain,text/markdown

logging:
  level:
    com.nexus: DEBUG
    org.springframework.security: INFO